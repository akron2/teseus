name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            python -c 'import os,re; from pathlib import Path; lines=(Path(os.environ["RUNNER_TEMP"])/"unittest.log").read_text().splitlines(); failures=[line.strip() for line in lines if re.match(r"\s*(FAIL|ERROR):", line)]; print("::error title=Unit test failures::" + ", ".join(failures)) if failures else None'
          fi
          exit "$result"
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python -m compileall -q src tests
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
      - run: python -c 'import harness, harness.cli, harness.engine, harness.memory, harness.openai_compatible, harness.persona, harness.storage, harness.telegram'
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python scripts/release_guard.py
