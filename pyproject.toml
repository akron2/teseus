[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teseus-harness"
version = "0.1.0"
description = "A local personal-agent harness with memory, forgetting, and initiative"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness = [
    "data/migrations/*.sql",
    "data/profiles/teseus-seed/*.json",
    "data/profiles/teseus-seed/*.md",
]
